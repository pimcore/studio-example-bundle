name: "Studio Frontend Build Packaged"

on:
  push:
    paths:
      - "assets/**"
      - "build-dist/**"
  pull_request:
    paths:
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: studio-frontend-build-packaged-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          # Caches the npm download cache, not ./assets/node_modules. Saving
          # node_modules from a separate install job needs a writable cache
          # token, which this workflow does not get; the restore then misses and
          # the job runs without any dependencies at all.
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        working-directory: ./assets
        run: npm ci

      - name: Run code linting
        working-directory: ./assets
        run: npm run lint-fix

      - uses: stefanzweifel/git-auto-commit-action@v5
        # A fork's branch is not writable with this repository's token.
        if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          branch: ${{ env.BRANCH_NAME }}
          commit_message: Apply eslint-fixer changes

  check-types:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        working-directory: ./assets
        run: npm ci

      - name: Run type checking
        working-directory: ./assets
        run: npm run check-types

  studio-frontend-build:
    needs:
      - lint
      - check-types
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build-packaged.yaml@main
    with:
      working-directory: assets
      # Handled by the lint and check-types jobs above; leaving these on would
      # run both a second time and have two jobs push to the branch at once.
      lint: false
      typecheck: false
