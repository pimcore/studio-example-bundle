services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # The scream score on Pimcore (F316): the ratings as GuestFeedback objects, the demo passes' code hashes in the
    # settings store. The rules (ScreamScore) take them through their interfaces; a real park swaps AnnualPasses for
    # its ticket system.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreFeedbackStore: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreAnnualPasses: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\FeedbackStore: '@Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreFeedbackStore'
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\AnnualPasses: '@Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreAnnualPasses'
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\ScreamScore: ~

    # coaster-demo:setup and coaster-demo:reset run these after the coaster demo (src/Command/CoasterDemo/ScreamScoreDemo.php):
    # the GuestFeedback class, the demo passes, the sample ratings and the park-staff user. The tests use an in-memory
    # ScreamScoreEnvironment instead.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Command\CoasterDemo\ScreamScoreDemo: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreScreamScoreEnvironment: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Command\CoasterDemo\ScreamScoreEnvironment:
        alias: Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreScreamScoreEnvironment
    # One Portal Engine public share per coaster for its guests (src/ScreamScore/Pimcore/GuestShares.php, F322): setup
    # makes them, reset renews them, and every guest link (the share's coaster page) comes from here.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\GuestShares: ~

    # The guest page (src/Portal/ScreamScore/GuestController.php, F317) finds a coaster's name by its ride key.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreRides: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Rides: '@Pimcore\Bundle\StudioExampleEnterpriseBundle\ScreamScore\Pimcore\PimcoreRides'
    # Tagged like CoasterFileController (config/portal.yaml): the subscriber tag gives it Twig and the CSRF token manager.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\ScreamScore\GuestController:
        tags: ['controller.service_arguments', 'container.service_subscriber']
    # The scream score of a public share's coaster, as JSON (src/Portal/ScreamScore/ShareRatingController.php, F324):
    # the share's hash and asset id name the ride; tagged like GuestController for the CSRF token manager.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\ScreamScore\ShareRatingController:
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # The park's page for the staff (src/Portal/ScreamScore/ParkController.php, F318): StaffAccess reads the signed-in
    # portal user; the controller is tagged like GuestController.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\ScreamScore\StaffAccess: ~
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\ScreamScore\ParkController:
        tags: ['controller.service_arguments', 'container.service_subscriber']
