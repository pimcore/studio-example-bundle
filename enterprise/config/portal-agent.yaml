# The portal's agent chat route (src/Portal/Agent/README.md), routed by config/pimcore/routing.yaml. It replays a
# recorded turn and needs only F126's KingdomBriefTools (config/agent.yaml), so it is loaded on every boot, with or
# without PimcoreAgentBundle; no `pimcore_agent:` key may ever go here.
services:
    _defaults:
        autowire: true
        autoconfigure: false
        public: false

    # Plays demo-data/agent/kingdom-brief-check.replay.json (ReplayPlayer::DEFAULT_REPLAY); pass $replayFile for another.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\Agent\ReplayPlayer: ~

    # A plain invokable controller (no AbstractController), so only its own tag is needed.
    Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\Agent\AgentChatController:
        public: true
        tags: ['controller.service_arguments']
