# Read by Pimcore's BundleRoutingLoader from every registered bundle: the application's config/routes.yaml never has
# to know this bundle (Portal Engine docs, "Portal Frontend Plugins", "Serving your own page"). Not under config/*.yaml
# on purpose: the extension loads those as service files.
# Every controller is named Class::__invoke, not the bare invokable class: Portal Engine's SecuritySubscriber reads
# the controller as [object, method] (getController()[0]) and answers 500 for a bare object (DR-F65-13).

# The portal page "Talk": the slide viewer full-screen, see assets/portal/talk/README.md.
pimcore_studio_example_enterprise_talk:
    # the portal's language/site prefix, so the page sits inside the portal
    path: /{_portal_engine_prefix}talk
    controller: Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\Talk\TalkController::__invoke
    # without it the route answers on every site of the installation
    condition: "request.attributes.get('isPortalEngineSite')"
    methods: [GET]
    # the same requirement Portal Engine's own routes carry
    requirements:
        _portal_engine_prefix: (?!\_)[^\/]+(?:\/[^\/]+)*\/|\_

# The text of a .coaster asset for the portal's coaster preview stage, see
# assets/portal/js/src/coaster/preview-stage/README.md. No language prefix: like the portal's own API, it is fetched by
# the plugin, never opened as a page.
pimcore_studio_example_enterprise_coaster_file:
    path: /studio-example-enterprise/coaster-file/{id}
    controller: Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\Coaster\CoasterFileController::__invoke
    condition: "request.attributes.get('isPortalEngineSite')"
    methods: [GET]
    requirements:
        id: '\d+'

# The portal's agent chat: a recorded turn as an event stream, see src/Portal/Agent/README.md. No language prefix:
# the portal's chat calls it like its own API. JSON 401/403 instead of a login redirect (the controller checks access).
pimcore_studio_example_enterprise_agent_chat:
    path: /studio-example-enterprise/agent/chat
    controller: Pimcore\Bundle\StudioExampleEnterpriseBundle\Portal\Agent\AgentChatController::__invoke
    condition: "request.attributes.get('isPortalEngineSite')"
    methods: [POST]

# The agent demo's confirmed write: the portal user confirms a stored Supplier-note proposal by its id, see
# src/Agent/Note/README.md. JSON 401/403/404/409 like the chat route; the id is F126's random 32-hex proposal id.
pimcore_studio_example_enterprise_agent_proposal_confirm:
    path: /studio-example-enterprise/agent/proposal/{id}/confirm
    controller: Pimcore\Bundle\StudioExampleEnterpriseBundle\Agent\Note\ConfirmController::__invoke
    condition: "request.attributes.get('isPortalEngineSite')"
    methods: [POST]
    requirements:
        id: '[0-9a-f]{32}'
