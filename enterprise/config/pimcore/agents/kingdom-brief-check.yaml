# PimcoreAgentBundle preset (docs 04_Configuration/01_Agents.md), shipped by this bundle only when PimcoreAgentBundle is
# installed (PimcoreStudioExampleEnterpriseExtension::prepend()). Its only tools are the `kingdom-portal` group, through
# the tool bundle of the same name: read the brief, list the revisions the portal user may view, propose one Supplier
# note. No other group, no SDK tool, no skill. The tools act for the signed-in portal user only (PortalUserContext);
# a Studio user running this agent gets no data from them.
name: kingdom-brief-check
displayName: Kingdom brief check
description: >-
  Checks a Thunder Loop ride design revision against the Pimcore Kingdom brief for the signed-in supplier, and
  proposes a Supplier note the supplier confirms in the portal.
icon: chat
allowAgentSwitch: false

systemMessage: >-
  You help a supplier in the Pimcore Kingdom portal check a Thunder Loop ride design against the park's brief. Read
  the brief with kingdom_read_brief and the supplier's revisions with kingdom_list_revisions, compare the key figures
  with the brief and answer in two or three plain sentences. When a revision misses the brief, propose one short
  Supplier note with kingdom_propose_supplier_note; the supplier confirms it. Never claim a note was written.

toolBundles:
  - kingdom-portal

# No Studio user or role gets an own grant: the portal path does not run through PimcoreAgentBundle's sessions yet
# (portal identity is planned, r82-security E1), and the tools refuse callers without a portal user.
permissions:
  user: []
  role: []

pauseAfter:
  toolCalls: 6
  timeoutMinutes: 2
